# Attaches a native Apple Silicon macOS app and the cross-platform jar to every GitHub release.
# Run manually for an existing release from Actions → Release artifacts → Run workflow (with its tag).
name: Release artifacts

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the existing release to attach the artifacts to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write # upload artifacts to the release

jobs:
  jar:
    name: Cross-platform JAR
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI has no mavenLocal snapshot: releases build against the published version of the same number.
      - name: Use the released pokemon-client
        run: |
          sed -i -E 's/^(pokemon-client = "[^"]+)-SNAPSHOT"/\1"/' gradle/libs.versions.toml
          grep '^pokemon-client = ' gradle/libs.versions.toml

      # -Puniversal ships the UI natives of every desktop platform in the one jar (see build.gradle.kts).
      - name: Test and build the universal JAR
        run: ./gradlew test packageUberJarForCurrentOS -Puniversal

      - name: Attach the JAR and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/compose/jars/*.jar | head -n 1)
          asset="ai-plays-online-${TAG}-universal.jar"
          cp "$jar" "$asset"
          shasum -a 256 "$asset" > "${asset}.sha256"
          gh release upload "$TAG" \
            "$asset#Cross-platform JAR (requires Java 21)" \
            "${asset}.sha256#SHA-256 for the cross-platform JAR" \
            --clobber

  macos:
    name: macOS Apple Silicon DMG
    # GitHub's macos-14 public runner is Apple Silicon (arm64). Keep the architecture check below as a guard.
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the released pokemon-client
        run: |
          sed -i '' -E 's/^(pokemon-client = "[^"]+)-SNAPSHOT"/\1"/' gradle/libs.versions.toml
          grep '^pokemon-client = ' gradle/libs.versions.toml

      # The JAR job runs the full suite; keep packaging separate from timing-sensitive tests on shared macOS runners.
      # packageDmg includes a Java runtime, so recipients do not need to install Java separately.
      - name: Build the macOS app
        run: ./gradlew packageDmg

      - name: Verify and attach the macOS DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = "arm64"
          app="build/compose/binaries/main/app/AI Plays Online.app"
          plist="$app/Contents/Info.plist"
          file "$app/Contents/MacOS/AI Plays Online" | grep -q 'arm64'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "me.nathanfallet.aiplaysonline"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${TAG#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$plist")" = "public.app-category.games"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "11.0"

          dmg=$(ls build/compose/binaries/main/dmg/*.dmg | head -n 1)
          asset="ai-plays-online-${TAG}-macos-arm64.dmg"
          cp "$dmg" "$asset"
          shasum -a 256 "$asset" > "${asset}.sha256"
          gh release upload "$TAG" \
            "$asset#macOS 11+ (Apple Silicon, Java bundled)" \
            "${asset}.sha256#SHA-256 for the macOS DMG" \
            --clobber
