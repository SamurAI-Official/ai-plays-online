version: 2
updates:
  # One grouped pull request a week for the Gradle side: the toolchain, the Compose/Koog/Ktor dependencies and the
  # dev.kotlinds artifacts (which the composite build substitutes, so a bump there is a submodule bump instead).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns: ["*"]

  # The workflows themselves (actions/checkout, setup-java, setup-gradle) move rarely: monthly is enough.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The engine and the client are submodules, so the app's build depends on two commits it pins: bumping them is a
  # dependency update like any other (and the app's own tests, plus testAll, say whether the new commits are good).
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
